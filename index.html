<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise SaaS Builder | Ultimate Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --builder-bg: #0B1120; --builder-surface: #1E293B; --builder-border: #334155;
            --builder-text: #F8FAFC; --builder-muted: #94A3B8; --builder-accent: #3B82F6;
            --builder-success: #10B981; --topbar-height: 64px; --sidebar-width: 260px; --inspector-width: 320px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: var(--builder-bg); color: var(--builder-text); }
        .d-none { display: none !important; }

        /* Top Bar & Controls */
        .top-bar { height: var(--topbar-height); background: var(--builder-surface); border-bottom: 1px solid var(--builder-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
        .viewport-btn { background: transparent; border: none; color: var(--builder-muted); width: 32px; height: 32px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .viewport-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .viewport-btn.active { background: #0F172A; color: var(--builder-accent); box-shadow: inset 0 0 0 1px var(--builder-border); }
        .btn-primary { background: var(--builder-accent); border: none; color: white; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid var(--builder-border); color: var(--builder-text); padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        
        /* Layout */
        .workspace { display: flex; height: calc(100vh - var(--topbar-height)); width: 100vw; }
        .left-sidebar { width: var(--sidebar-width); background: var(--builder-surface); border-right: 1px solid var(--builder-border); overflow-y: auto; }
        .section-label { font-size: 0.65rem; text-transform: uppercase; color: var(--builder-muted); padding: 20px 20px 8px; display: block; font-weight: 700; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 20px; color: var(--builder-muted); font-size: 0.85rem; cursor: pointer; }
        .nav-item.active { color: var(--builder-accent); background: #0F172A; border-right: 3px solid var(--builder-accent); }
        
        .canvas-area { flex-grow: 1; background: #0F172A; display: flex; justify-content: center; align-items: flex-start; padding: 40px; overflow: auto; }
        .canvas-container { background: white; width: 1440px; min-height: 800px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border-radius: 12px; transition: width 0.3s ease; overflow-x: hidden; }
        .canvas-container.view-tablet { width: 768px; }
        .canvas-container.view-mobile { width: 375px; }

        /* Inspector */
        .right-inspector { width: var(--inspector-width); background: var(--builder-surface); border-left: 1px solid var(--builder-border); display: flex; flex-direction: column; }
        .inspector-header { height: 60px; border-bottom: 1px solid var(--builder-border); display: flex; align-items: center; padding: 0 20px; font-size: 0.9rem; font-weight: 600; }
        .inspector-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .control-group { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--builder-border); }
        .control-label { display: block; font-size: 0.75rem; color: #E2E8F0; margin-bottom: 12px; text-transform: uppercase; font-weight: 700; }
        .form-control-saas { background: #0F172A; border: 1px solid var(--builder-border); color: white; border-radius: 6px; padding: 10px; width: 100%; font-size: 0.85rem; margin-bottom: 10px; }
        
        /* Modals & Toggles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(11, 17, 32, 0.95); z-index: 1000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--builder-surface); border: 1px solid var(--builder-border); width: 850px; border-radius: 12px; display: flex; flex-direction: column; }
        .modal-body { padding: 20px; max-height: 70vh; overflow-y: auto; }
        pre { background: #0B1120; padding: 15px; border-radius: 8px; color: #38BDF8; font-size: 0.8rem; overflow-x: auto; white-space: pre-wrap; }
        .saas-toggle { position: relative; width: 36px; height: 20px; appearance: none; background: var(--builder-border); border-radius: 20px; cursor: pointer; transition: 0.3s; }
        .saas-toggle:checked { background: var(--builder-accent); }
        .saas-toggle::before { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; top: 2px; left: 2px; background: #fff; transition: 0.3s; }
        .saas-toggle:checked::before { transform: translateX(16px); }

        /* Template Canvas Scoped CSS */
        #template-root {
            --color-primary: #111827; --color-accent: #2563EB; --color-bg: #F8FAFC;
            --color-surface: #FFFFFF; --color-text: #475569;
            --font-heading: 'Outfit', sans-serif; --font-body: 'Inter', sans-serif;
            --container-width: 1200px; --spacing-y: 100px; --radius: 12px;
            background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); min-height: 100%; transition: all 0.3s; line-height: 1.6;
        }
        .t-container { max-width: var(--container-width); margin: 0 auto; padding: 0 24px; transition: max-width 0.3s; }
        .t-heading { font-family: var(--font-heading); color: var(--color-primary); font-weight: 800; margin-bottom: 1rem; }
        .t-btn { background: var(--color-accent); color: #fff; padding: 12px 28px; border-radius: var(--radius); text-decoration: none; font-weight: 600; display: inline-block; cursor: pointer; }
        .t-section { padding: var(--spacing-y) 0; }
        .t-grid-3 { display: grid; gap: 30px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .t-grid-2 { display: grid; gap: 30px; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); }
        .t-card { background: var(--color-surface); border-radius: var(--radius); overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .t-media-16-9 { aspect-ratio: 16/9; overflow: hidden; }
        .t-media-4-3 { aspect-ratio: 4/3; overflow: hidden; }
        .t-media-fill { width: 100%; height: 100%; object-fit: cover; }
        
        .editable-element { cursor: pointer; position: relative; transition: 0.2s; border-radius: 4px; }
        .editable-element:hover { outline: 2px dashed var(--builder-accent); outline-offset: 4px; }
        .editable-element.selected-element { outline: 3px solid var(--builder-accent); outline-offset: 4px; z-index: 10; background: rgba(59, 130, 246, 0.05); }
    </style>
</head>
<body>
